/* v0.20.2 (WP1, groundwork): the fonts are hosted with the game (fonts/, SIL Open Font Licence files beside them); no Google Fonts call.
   Black Ops One and Barlow are what the page uses today. Rajdhani and JetBrains Mono are declared for the style guide's interface (WP6);
   a browser only downloads a font when text uses it. Barlow 500 is not in the package: the page asks for 400 or 600 only (v0.21; cardface.js still names 500 on the card faces, which draws as 400, and is left as it is because the style guide fixture pins its hash). */
@font-face{font-family:"Black Ops One";src:url("test/first-look-384b/fonts/BlackOpsOne-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Barlow;src:url("test/first-look-384b/fonts/Barlow-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:Barlow;src:url("test/first-look-384b/fonts/Barlow-SemiBold.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:Rajdhani;src:url("test/first-look-384b/fonts/Rajdhani-SemiBold.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
@font-face{font-family:Rajdhani;src:url("test/first-look-384b/fonts/Rajdhani-Bold.woff2") format("woff2");font-weight:700;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("test/first-look-384b/fonts/JetBrainsMono-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"JetBrains Mono";src:url("test/first-look-384b/fonts/JetBrainsMono-SemiBold.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
/* Layers (style guide 5; values in tokens.css as --ss-layer-*): 0 world, 1 scrim and grid, 10 table, 30 HUD, 50 transient feedback,
   100 modal and inspector. Today's z-index values (2 to 41) move onto these names with the HUD work (WP7 and WP9), not before. */
:root{--ui:1;--tsz:1;--ts:calc(var(--ui) * var(--tsz));--ink:#e8e2cf;--dim:#a9a48f;--line:rgba(232,226,207,.28);--panel:rgba(14,18,16,.86);--amber:#e0a85a;--teal:#7fe0c8;--red:#d8674e;--blue:#7fb6d8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c0f0e;color:var(--ink);font-family:Barlow,system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block}
.fx{position:fixed;inset:0;pointer-events:none}
#vig{background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 50%,rgba(4,8,8,.6) 100%)}
#flash{background:#ffd9a0;opacity:0}
.t{font-family:"Black Ops One",Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase;font-weight:400}
button{font-family:"Black Ops One",Impact,sans-serif;letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--amber);background:rgba(224,168,90,.14);color:var(--amber);padding:9px 12px;font-size:calc(12.5px * var(--ts));cursor:pointer;pointer-events:auto;border-radius:0}
button:active{background:rgba(224,168,90,.35)}button:disabled{opacity:.45}
button.ghost{border-color:var(--line);color:var(--ink);background:rgba(255,255,255,.05)}
button.go{border-color:var(--red);color:#ffd9cc;background:rgba(216,103,78,.25)}
button.opt{display:block;width:100%;text-align:left;font-family:Barlow,system-ui,sans-serif;text-transform:none;letter-spacing:0;font-size:calc(13.5px * var(--ts));font-weight:400;line-height:1.25;color:var(--ink);border-color:var(--line);background:rgba(255,255,255,.06);margin-top:6px}
#top,#bot{position:fixed;left:0;right:0;pointer-events:none}
#top{top:0;padding:6px 56px 14px 10px;background:linear-gradient(180deg,rgba(8,11,10,.9) 60%,rgba(8,11,10,0))}
#bot{bottom:0;padding:0 10px 8px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(0deg,rgba(8,11,10,.94) 70%,rgba(8,11,10,0))}
.stat{display:flex;align-items:center;gap:10px;font-size:calc(12px * var(--ts));color:var(--dim);flex-wrap:wrap}
.stat .who{font-size:calc(13px * var(--ts));color:var(--ink)}.stat .who small{font-family:Barlow;text-transform:none;letter-spacing:0;color:var(--dim);font-size:calc(12px * var(--ts));margin-left:5px}
.stat b{color:var(--ink);font-family:"Black Ops One",Impact,sans-serif;font-weight:400;font-size:calc(14px * var(--ts));margin-left:3px;display:inline-block;min-width:2ch;font-variant-numeric:tabular-nums}   /* v0.21: room for two digits from the start, so a counter reaching 10 never wraps the bar mid-game */
.hf{display:flex;align-items:center;gap:5px}.hf i{display:block;width:74px;height:6px;background:rgba(255,255,255,.12);position:relative}
.hf i u{position:absolute;left:0;top:0;bottom:0;background:var(--red);transition:width .6s}.me .hf i u{background:var(--blue)}
.hf.hit b{color:#ff9a7a;transition:none}.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-left:4px}
.pips span{width:7px;height:7px;border:1px solid var(--teal);transform:rotate(45deg)}.pips span.on{background:var(--teal)}
#phase{font-size:calc(12px * var(--ts));color:var(--amber);margin-bottom:3px}
#phase small{font-family:Barlow;color:var(--dim);letter-spacing:0;text-transform:none;font-size:calc(12px * var(--ts))}
.stat .s{display:none}@media (max-width:600px){#feed div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:calc(12px * var(--ts))}.stat .l{display:none}.stat .s{display:inline}.stat{gap:8px}.hf i{width:44px}}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.chip{pointer-events:auto;font-size:calc(12px * var(--ts));padding:2px 7px;border:1px solid var(--line);background:rgba(10,14,13,.7);cursor:pointer}.chip b{color:var(--amber);font-family:"Black Ops One",Impact,sans-serif;font-weight:400;margin-right:4px}
#tools{position:fixed;right:8px;top:6px;display:flex;flex-direction:column;align-items:flex-end;gap:6px;z-index:6}
#bMenu{font-size:calc(19px * var(--ts));line-height:1;padding:6px 10px}
#menu{display:flex;flex-direction:column;gap:6px;padding:8px;background:rgba(14,18,16,.96);border:1px solid var(--line)}#menu[hidden]{display:none}#menu button{text-align:left}
#feed{position:fixed;left:8px;display:flex;flex-direction:column;gap:3px;pointer-events:none;max-width:min(calc(100vw - 70px),440px)}
#feed div{font-size:calc(12px * var(--ts));line-height:1.25;padding:4px 8px;background:rgba(10,14,13,.74);border-left:3px solid var(--line);animation:fin .3s ease-out;transition:opacity .8s}
#feed div.own{border-left-color:var(--blue)}#feed div.foe{border-left-color:var(--red)}#feed div.big{border-left-color:var(--amber);color:#fff}
@keyframes fin{from{transform:translateX(-22px);opacity:0}to{transform:none;opacity:1}}
#route{position:fixed;right:6px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;pointer-events:none;font-size:calc(12px * var(--ts));color:var(--dim);text-align:center}
#route div{width:30px;height:24px;border:1px solid var(--line);background:rgba(10,14,13,.6);display:flex;align-items:center;justify-content:center;gap:1px;font-size:calc(13px * var(--ts))}
#route div.c{border-color:var(--amber)}#route div.k{border-color:var(--red);background:rgba(216,103,78,.3)}
#route .o{color:var(--blue)}#route .f{color:var(--red)}
#route.live{pointer-events:auto;cursor:grab;touch-action:none}#route.live div{border-color:var(--teal)}#route div.hov{background:rgba(127,224,200,.35);border-color:#fff}
#route .ctst{margin:0 0 6px;padding:4px 2px;border:1px solid var(--amber);background:rgba(10,14,13,.85);font-size:calc(12px * var(--ts));line-height:1.25;color:var(--amber);width:52px;margin-left:-11px}
#route .ctst b{display:block;font-size:calc(17px * var(--ts));font-family:"Black Ops One",Impact,sans-serif}#route .ctst b.f{color:var(--red)}#route .ctst b.o{color:var(--blue)}#route .ctst i{display:block;font-style:normal;color:var(--dim)}#route .ctst em{display:block;font-style:normal;color:var(--ink);font-size:calc(12px * var(--ts))}
#prompt .hits{border:1px solid var(--red);background:rgba(216,103,78,.14);padding:6px 8px;margin:0 0 6px;font-size:calc(13px * var(--ts));line-height:1.35}
#dragGhost{position:fixed;z-index:30;pointer-events:none;display:none;transform:translate(-50%,-60%) rotate(-4deg);filter:drop-shadow(0 8px 14px rgba(0,0,0,.7))}#dragGhost img{height:150px;border-radius:6px;opacity:.92}
#hand img{touch-action:none}#mtrack.drop{outline:2px solid var(--teal);outline-offset:3px}
/* v0.19.4: drag feedback. Places that take the card pulse; a line under the dragged card says what letting go does */
#mtrack.can::after{content:"";position:absolute;inset:-5px;border:2px dashed var(--teal);pointer-events:none;animation:canPulse 1.1s ease-in-out infinite}#mtrack.can.drop{outline:2px solid var(--teal);outline-offset:3px}#mtrack.can.drop::after{display:none}
@keyframes canPulse{50%{opacity:0}}   /* v0.20.2 (WP1): highlight pulses animate opacity only */
#dragGhost.unit img{height:120px}#dragGhost.ok img{outline:3px solid var(--teal);outline-offset:2px}
#dragGhost .dtip{position:absolute;left:50%;top:100%;margin-top:8px;transform:translateX(-50%) rotate(4deg);white-space:nowrap;background:rgba(8,12,16,.92);color:#e8eef2;font:600 calc(13px * var(--ts)) system-ui,sans-serif;padding:5px 9px;border-radius:7px;border:1px solid #4a5560}
#dragGhost.ok .dtip{border-color:var(--teal);color:#c8f5ec}
#mtrack.hh{animation:hhIn 1.5s ease-out}@keyframes hhIn{0%{filter:none}15%{filter:drop-shadow(0 0 10px #ffd27a) brightness(1.5)}100%{filter:none}}
#mtrack{position:fixed;left:5px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;font-size:calc(12px * var(--ts));color:var(--dim);z-index:2}
#mtrack em{font-style:normal;writing-mode:vertical-rl;position:absolute;left:100%;top:50%;transform:translateY(-50%) rotate(180deg);letter-spacing:.2em;margin-left:2px;opacity:.7;white-space:nowrap}
#mtrack hr{border:0;border-top:1px solid var(--amber);margin:3px 0;width:100%}
#mtrack .ms{position:relative;width:38px;min-height:38px;border:1px dashed var(--line);background:rgba(10,14,13,.55);display:flex;flex-direction:column;gap:2px;padding:1px}
#mtrack .ms.hh{border:1px solid var(--amber)}#mtrack .ms i{position:absolute;right:2px;bottom:0;font-style:normal;font-size:calc(12px * var(--ts));color:var(--dim);font-family:"Black Ops One",Impact,sans-serif}
#mtrack .ms span{display:block;width:34px;height:34px;border:2px solid;background-size:cover;background-position:center 30%;cursor:pointer;position:relative;overflow:hidden}
#mtrack .ms span b{position:absolute;left:0;right:0;bottom:0;background:rgba(10,12,12,.78);color:var(--ink);font-size:calc(12px * var(--ts));font-weight:600;line-height:1.1;padding:1px;text-align:center}
@media (min-width:900px) and (min-height:521px){#mtrack .ms{width:calc(74px * var(--ui));min-height:calc(60px * var(--ui))}#mtrack .ms span{width:calc(68px * var(--ui));height:calc(54px * var(--ui))}#mtrack .ms span b{font-size:calc(12px * var(--ts))}#mtrack .ms i{font-size:calc(13px * var(--ts))}#mtrack{left:10px}#route div{width:calc(40px * var(--ui));height:calc(32px * var(--ui))}}
@media (max-height:520px){#mtrack .ms{width:30px;min-height:22px}#mtrack .ms span{width:26px;height:20px}#mtrack .ms span b{display:none}}
#hand{display:flex;justify-content:center;align-items:flex-end;pointer-events:none;height:calc(96px * var(--ui))}
#hand img{height:calc(92px * var(--ui));width:auto;margin:0 -5px;border-radius:5px;box-shadow:0 4px 10px rgba(0,0,0,.6);pointer-events:auto;cursor:pointer;transition:transform .15s,box-shadow .15s}
#hand img.can{box-shadow:0 0 0 2px var(--teal),0 0 14px var(--teal)}#hand img.sel{transform:translateY(-14px) scale(1.08);box-shadow:0 0 0 2px #fff,0 0 18px var(--amber)}
#prompt{pointer-events:auto;border:1px solid var(--line);background:var(--panel);padding:8px 10px;margin:0;max-height:38vh;overflow:hidden;touch-action:pan-y;display:flex;flex-direction:column;box-sizing:border-box}
#prompt .pwrap{position:relative;flex:1 1 auto;min-height:0;display:flex;flex-direction:column}#prompt .pbody{flex:1 1 auto;min-height:0;overflow-y:auto;touch-action:pan-y;overscroll-behavior:contain}
#prompt .pmore{display:none;position:absolute;left:0;right:0;bottom:0;margin:0;padding:calc(10px * var(--ts)) 2px 0;border:0;min-height:0;text-align:right;background:linear-gradient(180deg,rgba(14,18,16,0),rgba(14,18,16,.97) 55%);color:var(--amber);font:600 calc(12.5px * var(--ts))/1.2 Barlow,system-ui,sans-serif;text-transform:none;letter-spacing:0;cursor:pointer}#prompt.more .pmore{display:block}
#prompt .pfoot{flex:none;overflow-y:auto;touch-action:pan-y}#prompt .pfoot #pUndo,#prompt .pfoot #pHint{padding-left:9px;padding-right:9px}#pHint .ic{display:none}.tight #pUndo .tx,.tight #pHint .tx{display:none}.tight #pHint .ic{display:inline}.tight #prompt .pfoot #pUndo,.tight #prompt .pfoot #pHint{min-width:44px;padding-left:6px;padding-right:6px}#prompt .ftip button#tipX{min-height:40px;padding:4px 12px;margin-left:4px}#prompt .pfoot>.btns{margin-top:6px}#prompt .pfoot.go>.btns{justify-content:flex-end}
#prompt p{margin:0;font-size:calc(13.5px * var(--ts));line-height:1.3}#prompt p.h{color:var(--dim);font-size:calc(12px * var(--ts));margin-top:3px}
#prompt .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}#prompt .why{color:#e9c9a0;font-size:calc(12px * var(--ts));margin-top:5px}
#preview{position:fixed;left:50%;transform:translateX(-50%);width:min(94vw,420px);border:1px solid var(--amber);background:rgba(14,18,16,.96);padding:10px 12px;display:none;z-index:5;max-height:60vh;overflow-y:auto;touch-action:pan-y}
#preview h3{margin:0 0 6px;font-size:calc(15px * var(--ts))}#preview table{width:100%;border-collapse:collapse;font-size:calc(13px * var(--ts))}
#preview td{padding:2px 0;border-bottom:1px solid rgba(255,255,255,.08)}#preview td:last-child{text-align:right;font-weight:600}#preview td:first-child{color:var(--dim)}
#preview .res{margin:6px 0;font-size:calc(14px * var(--ts));color:var(--amber)}#preview .row{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
#preview .alt{border-top:1px solid var(--line);margin-top:8px;padding-top:6px}
.dmg{position:fixed;font-family:"Black Ops One",Impact,sans-serif;font-size:calc(30px * var(--ts));color:#ffcf9a;text-shadow:0 0 12px #e2571e,0 2px 0 #000;pointer-events:none;animation:up 1.3s ease-out forwards;z-index:4}
.dmg.sup{font-family:Barlow,system-ui,sans-serif;font-weight:700;font-size:calc(19px * var(--ts));color:#f2c46b;text-shadow:0 0 8px #6b4a10,0 2px 0 #000;animation-duration:1.8s;white-space:nowrap;transform:translateX(-50%)}   /* v0.20: a Base's share of a payment (Patch 15, 60/40) */
@keyframes up{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}15%{transform:translate(-50%,-70%) scale(1.25);opacity:1}100%{transform:translate(-50%,-190%) scale(1);opacity:0}}
#banner{position:fixed;left:0;right:0;top:36%;text-align:center;font-size:calc(clamp(30px,9vw,72px) * var(--tsz));color:#fff;text-shadow:0 0 30px rgba(224,168,90,.8),0 3px 0 #000;pointer-events:none;opacity:0}
#banner.on{animation:ban 1.5s ease-out}@keyframes ban{0%{opacity:0;letter-spacing:.5em}18%{opacity:1;letter-spacing:.12em}75%{opacity:1}100%{opacity:0}}
#banner small{display:block;font-family:Barlow;font-size:calc(15px * var(--ts));letter-spacing:.2em;color:var(--amber);text-transform:uppercase}
#show{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%) scale(.6);opacity:0;pointer-events:none;z-index:4;text-align:center}
#show img{height:min(46vh,430px);border-radius:12px;box-shadow:0 0 0 2px rgba(224,168,90,.6),0 10px 50px #000}#show.hot img{box-shadow:0 0 0 3px #e0a85a,0 0 60px rgba(224,168,90,.7)}
#showLab{display:inline-block;margin-top:8px;font-size:calc(13px * var(--ts));color:var(--amber);background:rgba(10,14,13,.88);padding:4px 10px;max-width:88vw}
@keyframes showIn{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}14%{opacity:1;transform:translate(-50%,-50%) scale(1.04)}22%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-56%) scale(.96)}}
.call{position:fixed;transform:translate(-50%,-50%);font-family:"Black Ops One",Impact,sans-serif;font-size:calc(13px * var(--ts));letter-spacing:.12em;color:#e8e2cf;background:rgba(10,14,13,.72);border-left:3px solid currentColor;padding:2px 7px;pointer-events:none;z-index:3;white-space:nowrap;animation:callIn 1.5s ease-out forwards}
@keyframes callIn{0%{opacity:0;margin-top:8px}12%{opacity:1;margin-top:0}75%{opacity:1}100%{opacity:0;margin-top:-14px}}
#vig.stand{background:radial-gradient(ellipse at 50% 46%,rgba(0,0,0,0) 42%,rgba(120,24,12,.55) 100%);animation:standP 1.6s ease-in-out infinite alternate}@keyframes standP{from{opacity:.65}to{opacity:1}}
#mtrack.tick .ms span{animation:tickP .9s ease-out}@keyframes tickP{0%{box-shadow:0 0 0 0 rgba(224,168,90,.9)}100%{box-shadow:0 0 0 10px rgba(224,168,90,0)}}
#log input[type=range]{accent-color:#e0a85a}
#cover{position:fixed;inset:0;z-index:9;background:rgba(6,9,8,.8);overflow-y:auto;touch-action:pan-y;padding:18px 14px 30px}

#cover .lead{color:var(--dim);margin:6px 0 14px;font-size:calc(14px * var(--ts))}

.form label{display:block;font-size:calc(12px * var(--ts));color:var(--dim);margin-bottom:3px}

#cover pre{white-space:pre-wrap;color:#ffb49a;font-size:calc(12px * var(--ts))}

/* ---- v0.12: the map board (setup, debrief, menu, replays) ---- */
:root{--ground:#141915;--board:rgba(19,24,20,.94);--khaki:#d6caa8;--friendly:#7fb6d8;--hostile:#d8674e}
#cover.map{background:var(--ground);padding:0}

.contours{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

#preview .alt p{font-size:calc(13px * var(--tsz))!important}
button.primary{border:0;background:#D8B66A;color:#0C1215;font:700 calc(19px * var(--tsz))/1.1 Rajdhani,Barlow,system-ui,sans-serif;letter-spacing:.07em;text-transform:uppercase;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px))}button.primary:active{background:#E9C77C}
button.primary:disabled,button.primary[aria-disabled=true]{color:#A4AEAE;background:rgba(17,29,31,.9) repeating-linear-gradient(135deg,rgba(232,237,232,.06) 0 2px,transparent 2px 8px);opacity:1}

/* v0.21 (craft pass): the panel's overflow cue is a small pill over a fade, not a band over the text; the pinned buttons in a row share its width and height */
#prompt .pmore{left:auto;right:4px;bottom:4px;padding:3px 10px;border:1px solid rgba(216,182,106,.6);background:#111D1F;color:#D8B66A;font:600 calc(13px * var(--ts))/1.2 Barlow,system-ui,sans-serif;text-transform:none;letter-spacing:.02em}

#prompt .pfoot>.btns>button{flex:1 1 auto;min-height:46px}

/* ===================== v0.21 (WP6 and WP7): one interface system =====================
   The style guide's tokens (tokens.css) and components, applied over the older screen rules: colours from the guide; Rajdhani for titles
   and controls, Barlow for reading, JetBrains Mono for counters and telemetry (Black Ops One stays on the cards themselves); one button set
   (primary amber, secondary dark, link), one sheet and panel surface, one chip and segmented control, one toast. Screen rules above set
   layout only from here on. Text sizes still scale with Settings > Text size (capped at 175% until WP9). */
:root{--ink:#E8EDE8;--dim:#B5C1C2;--line:rgba(181,193,194,.3);--panel:rgba(17,29,31,.94);--amber:#D8B66A;--teal:#91D9E8;--red:#E89A8C;--blue:#8AB9D1;--khaki:#E8C77B;
  --surface:#111D1F;--surface-2:#16262A;--boundary:#75858D;--action:#D8B66A;--action-hi:#E9C77C;--on-action:#0C1215;--hatch:repeating-linear-gradient(135deg,rgba(232,237,232,.06) 0 2px,transparent 2px 8px);
  --f-title:Rajdhani,Barlow,system-ui,sans-serif;--f-body:Barlow,system-ui,sans-serif;--f-mono:"JetBrains Mono",ui-monospace,monospace;--chamfer8:polygon(0 0,calc(100% - 8px) 0,100% 8px,100% 100%,8px 100%,0 calc(100% - 8px));--chamfer12:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
html,body{background:#0C1215}
/* type scale */
.t,#settings h4,#piles h4,#fm .fmb h4,#wint h4,.step h2,#prompt .coach .ct,.dbk{font-family:var(--f-title);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
h3.t{font-size:calc(24px * var(--ts));line-height:1.1}#settings h4,#piles h4,#fm .fmb h4,#wint h4{font-size:calc(19px * var(--ts));color:var(--ink)}
.step h2{font-size:calc(22px * var(--ts))}#prompt .coach .ct{font-size:calc(20px * var(--ts));line-height:1.1}.dbk{font-size:clamp(calc(44px * var(--ts)),10vw,86px)}
.stat b,.chip b,#route .ctst b,#mtrack .ms i{font-family:var(--f-mono);font-weight:600;letter-spacing:0}
.dmg{font-family:var(--f-mono);font-weight:600}.call,#spots .spot span,.rtag,#capt b{font-family:var(--f-mono);font-weight:600;letter-spacing:.08em}
#banner{font-family:var(--f-title);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.force b{font-family:var(--f-title);font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:calc(19px * var(--ts))}
#prompt p{font-size:calc(15px * var(--ts));line-height:1.4}#prompt p.h{font-size:calc(13.5px * var(--ts))}#prompt .coach .cx,#prompt .coach .cd{font-size:calc(16px * var(--ts))}
/* buttons: one set. Secondary is the default; primary is the one commitment on a screen; link for small extras */
button{font:700 calc(15px * var(--ts))/1.15 var(--f-title);letter-spacing:.07em;text-transform:uppercase;color:var(--ink);background:rgba(17,29,31,.92);border:1px solid var(--boundary);border-radius:0;min-height:44px;padding:8px 14px;clip-path:var(--chamfer8)}
button:hover{background:#1F3337}button:active{background:#263C40}
button:focus-visible{outline:3px solid var(--teal);outline-offset:-3px}
button.ghost{color:var(--ink);background:rgba(17,29,31,.92);border-color:var(--boundary)}
button.go,button.cgo,button.big,button.primary,#prompt button.cgo,.seg button[aria-pressed=true]:not(.x){border:1px solid var(--action);background:var(--action);color:var(--on-action)}
button.go:hover,button.cgo:hover,button.big:hover,button.primary:hover{background:var(--action-hi)}
button.big{font-size:calc(19px * var(--ts))!important;padding:14px 26px;min-height:56px}
button:disabled,button[aria-disabled=true]{color:#A4AEAE;background:rgba(17,29,31,.9) var(--hatch);border-color:rgba(117,133,141,.6);opacity:1;cursor:not-allowed}
button.lk,#prompt button.lk{clip-path:none;border:0;background:none;min-height:0;padding:4px 2px;font:600 calc(13px * var(--ts)) var(--f-body);letter-spacing:0;text-transform:none;color:var(--dim);text-decoration:underline}
button.opt,#prompt button.opt{font:400 calc(15px * var(--ts))/1.3 var(--f-body);letter-spacing:0;text-transform:none;text-align:left;color:var(--ink);background:rgba(17,29,31,.92);border:1px solid var(--boundary)}
#prompt button small.which{font-weight:400}
.su button,#debrief button,#menu button{font:700 calc(15px * var(--ts))/1.15 var(--f-title);letter-spacing:.07em;text-transform:uppercase}
#menu button{text-align:left;width:100%}
/* the buttons that are pictures, toggles or cues keep their own shape */
#piles .pt button,#libGrid button,button.pick,.pmore,#zMore,.pvmore,#hand button,.force,.rr button,.psw button,.sf .scale button,#opBar button,#route button{clip-path:none}
#piles .pt button,#libGrid button{min-height:0}
/* segmented controls and chips: one look */
.seg,.seg2,.chips2{border:1px solid var(--boundary);background:rgba(12,18,21,.7)}
.seg button,.seg2 button,.chips2 button{clip-path:none;border:0;border-right:1px solid rgba(117,133,141,.5);background:none;color:var(--dim);min-height:44px;font:600 calc(14px * var(--ts))/1.15 var(--f-title);letter-spacing:.06em;text-transform:uppercase}
.seg button[aria-pressed=true],.seg2 button[aria-pressed=true],.chips2 button[aria-pressed=true]{background:var(--action);color:var(--on-action)}
/* surfaces: one panel (HUD, solid over the 3D table: spec 7.2) and one full-screen sheet */
#prompt{background:var(--panel);border:0;border-top:1px solid rgba(181,193,194,.38);clip-path:var(--chamfer12)}
#menu,#wint{background:var(--surface);border:1px solid rgba(181,193,194,.38);clip-path:var(--chamfer12)}
#log,#piles,#settings,#lib,#fm,#send{background:#0C1215}
#log>*,#settings .sb,#piles .pb{max-width:860px}#settings .sb,#piles .pb{margin:0 auto}
#debrief{background:radial-gradient(ellipse at 50% 40%,rgba(12,18,21,.8),rgba(8,12,14,.96))}
#debrief .db{background:var(--surface);border-top:1px solid rgba(181,193,194,.38);clip-path:var(--chamfer12)}
/* toasts and transient lines: one look */
#feed div{background:rgba(12,18,21,.86);border-left:3px solid var(--boundary);font-family:var(--f-body)}#feed div.own{border-left-color:var(--blue)}#feed div.foe{border-left-color:var(--red)}
#capt{background:rgba(12,18,21,.92);border-left:3px solid var(--teal)}
.call{background:rgba(12,18,21,.82)}
/* the coach and tips, in the guide's colours */
#prompt .coach{background:rgba(216,182,106,.08);border:0;border-left:3px solid var(--action)}#prompt .coach .ck{font-family:var(--f-mono);letter-spacing:.1em;color:var(--action)}#prompt .coach .cd{color:var(--khaki)}
#prompt .coach.moment{border-left-color:var(--teal);background:rgba(145,217,232,.07)}#prompt .coach.moment .ck{color:var(--teal)}
#settings .seg2 button,#lib .seg2 button,#fm .seg2 button,#settings .seg2 button,.chips2 button{font:600 calc(14px * var(--ts))/1.15 var(--f-title);letter-spacing:.06em;text-transform:uppercase}
.su-h .gear{font:700 calc(15px * var(--ts))/1.15 var(--f-title);letter-spacing:.07em;text-transform:uppercase;padding:10px 14px}

/* v0.21 (WP9, spec 2): the hand. A strip of cards everywhere; on a phone held upright, a drawer with a 48 px handle under the table */
#hand .strip{display:flex;justify-content:center;align-items:flex-end;height:100%;width:100%;position:relative;pointer-events:none}
#hand .hhandle,#hand .hnav{display:none}
.ph #hand{height:48px;overflow:visible}
.ph #bot{z-index:3}
.ph #hand .hhandle{display:flex;position:absolute;left:0;right:0;bottom:2px;height:44px;min-height:44px;padding:0 14px;align-items:center;justify-content:space-between;pointer-events:auto;clip-path:none;border:1px solid var(--boundary);background:var(--surface);font:700 calc(16px * min(var(--ts),1.4))/1 var(--f-title);letter-spacing:.08em}
.ph #hand .hhandle i{font-style:normal;color:var(--action)}
.ph #hand .strip{position:absolute;left:-10px;right:-10px;bottom:48px;height:162px;width:auto;padding:12px 12px 10px;justify-content:flex-start;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;background:linear-gradient(0deg,rgba(12,18,21,.97),rgba(12,18,21,.9));border-top:1px solid rgba(181,193,194,.38);pointer-events:auto;transition:transform .18s ease-out,opacity .18s;overscroll-behavior:contain}
.ph #hand .strip::-webkit-scrollbar{display:none}.ph #hand .strip.fits{justify-content:center}
.ph #hand:not(.open) .strip{transform:translateY(30px);opacity:0;visibility:hidden;pointer-events:none}
.ph body.dragging #hand .strip{visibility:visible;opacity:.94;transform:none;height:58px;overflow:hidden;padding:0;background:rgba(12,18,21,.92);border-top:1px dashed var(--action);-webkit-mask-image:none}.ph body.dragging #hand .strip>*{display:none}.ph body.dragging #hand .strip::after{content:"Let go here: back to your hand";margin:auto;font:600 calc(15px * min(var(--ts),1.4)) var(--f-body);color:var(--action)}   /* v0.21: while a card is lifted the drawer drops to a slim band; the table above it is free to aim at, and the band and handle take the card back */
.ph #hand .strip img{height:132px;margin:0;flex:none}
.ph #hand.cl .hnav.l,.ph #hand.cr .hnav.r{display:block}
.ph #hand.open .hnav{position:absolute;bottom:96px;width:36px;height:56px;min-height:0;padding:0;z-index:32;pointer-events:auto;clip-path:none;background:rgba(12,18,21,.92);border:1px solid var(--boundary);font:700 26px/1 var(--f-title)}
.ph #hand:not(.open) .hnav{display:none!important}.ph #hand .hnav.l{left:-6px}.ph #hand .hnav.r{right:-6px}
.ph #hand.cl .strip{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px)}.ph #hand.cr .strip{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 40px),transparent)}.ph #hand.cl.cr .strip{-webkit-mask-image:linear-gradient(90deg,transparent,#000 40px,#000 calc(100% - 40px),transparent)}
.rm .ph #hand .strip,.ph.rm #hand .strip{transition:none}
.ph.sq2 #hand,.ph.sq3 #hand{height:48px}.ph.sq2 #hand img,.ph.sq3 #hand img{height:132px}

/* v0.21 (WP9): the status bars on a phone held upright: one row a side (Homefront, ISR, Supply), the rest one tap away under "More" */
.stat .sbtn{display:none}
.ph #top .stat .x,.ph #me .stat .x{display:none}
.ph #top .stat .sbtn,.ph #me .stat .sbtn{display:inline-flex;align-items:center;min-height:36px;padding:4px 10px;margin-left:auto;pointer-events:auto;font:700 calc(13px * min(var(--ts),1.4))/1 var(--f-title);letter-spacing:.08em}
.ph #me .stat,.ph #top .stat{flex-wrap:nowrap;white-space:nowrap}.ph #me .stat>span,.ph #top .stat>span{flex:none}
#piles .stat.full{display:flex;flex-wrap:wrap;gap:6px 14px;margin:4px 0 12px;font-size:calc(14px * var(--ts))}#piles .stat.full .x{display:inline}#piles .stat.full .pips{display:inline-flex}

/* v0.21 (WP10, spec 3.3): desktop and laptop: the commitment column on the right; the hand dock between the Mission Track and the column */
.desk #prompt{position:fixed;right:16px;top:var(--colTop,90px);bottom:var(--colBot,48px);width:var(--colW,340px);max-width:none;height:auto;max-height:none;align-self:auto;z-index:3;padding:12px 14px}
.desk #bot{padding-right:calc(var(--colW,340px) + 28px)}
.desk #route{right:calc(var(--colW,340px) + 30px)}
.desk #preview.col{left:auto;right:16px;transform:none;width:var(--colW,340px)}
.desk #peek.r{right:calc(var(--colW,340px) + 76px)}

/* v0.21 (WP9, spec 3.1): with large text the phone's status rows fold to Homefront and ISR; the rest is under More */
.ph.bigtext #top .stat .c-sup,.ph.bigtext #me .stat .c-sup,.ph.bigtext .stat .who small,.ph.bigtext .stat .hf i{display:none}
.ph.bigtext #top .stat,.ph.bigtext #me .stat{gap:4px 10px}

/* v0.21 (craft notes): phone top lane. The flag and menu buttons sit side by side in the round line's own lane; the status row below runs
   the full width, so nothing overlaps a control */
.ph #tools{flex-direction:row;top:4px;right:6px;gap:6px}.ph #tools>button{min-height:40px;height:40px;min-width:44px;padding:0 10px}
.ph #top{padding-right:10px}.ph #phase{min-height:40px;padding-right:104px;display:flex;align-items:center;flex-wrap:wrap;margin-bottom:2px}
/* the Inspector dims the whole screen behind it on phones, so the round line does not compete with the card */
#zScrim{background:rgba(4,9,10,.72)}
/* desktop column: as tall as its content (at least 220 px), anchored above your status bar */
.desk #prompt{top:auto;max-height:calc(100vh - var(--colTop,90px) - var(--colBot,48px));min-height:220px}
/* the decision's own choices are the primary pair; Undo and Hint are compact icons (their names stay as labels) */
#prompt .pfoot #pUndo .tx,#prompt .pfoot #pHint .tx{display:none}#prompt .pfoot #pHint .ic{display:inline}#prompt .pfoot #pUndo,#prompt .pfoot #pHint{flex:0 0 46px;min-width:46px;padding-left:4px;padding-right:4px;font-size:calc(18px * min(var(--ts),1.4))}
#prompt .ftip button#tipX{display:inline-flex;min-height:40px;vertical-align:middle}
#prompt .pbody.trim{flex:0 0 auto}#zBody.trim{flex:0 0 auto}

/* the More pills sit in space kept for them under the trimmed text, never over a line */
#zWrap{flex-direction:column}#zMore{position:static;align-self:flex-end;margin:2px 14px 4px}
#preview .pvmore{position:static;align-self:flex-end;margin:2px 16px 4px}
#prompt .pwrap{display:flex;flex-direction:column}#prompt .pmore{position:static;align-self:flex-end;margin:2px 2px 0}
.ph body.dragging #hand{opacity:1}.ph body.dragging #hand .hhandle{opacity:.5}
#zAct button.zab.zsec{background:rgba(17,29,31,.9);border:1px solid #75858D;color:#E8EDE8}
#zScrim{background:rgba(4,9,10,.86)}

/* v0.21 (Council): READY tabs, dimmed cards that cannot act, TARGET plates, the instruction line and the folded first-time tip */
#hand .rdy{position:absolute;z-index:3;pointer-events:none;padding:2px 6px 1px;background:var(--action);color:var(--on-action);font:600 10px/1.1 var(--f-mono);letter-spacing:.06em;clip-path:polygon(0 0,100% 0,100% 70%,calc(100% - 5px) 100%,0 100%)}
#hand img.cant{filter:brightness(.72) saturate(.55)}#hand img.can{box-shadow:0 0 0 2px var(--action),0 4px 10px rgba(0,0,0,.6)}
#tplates{position:fixed;inset:0;pointer-events:none;z-index:4}#tplates span{position:absolute;transform:translateX(-50%);padding:1px 6px;background:#E89A8C;color:#0C1215;font:600 10px/1.2 var(--f-mono);letter-spacing:.08em}
#prompt p.instr{font-weight:600}
#prompt .ftip{display:flow-root;border-left:3px solid var(--khaki);padding:3px 8px;margin:6px 0}#prompt .ftip p{margin:0;font-size:calc(13.5px * var(--ts));display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}#prompt .ftip.open p{display:block}
#prompt .ftip button#tipX{float:right;margin:0 0 4px 8px;min-height:36px;padding:2px 10px;text-decoration:none;border:1px solid var(--boundary);color:var(--ink)}
#prompt .pbody,#zBody,#preview .pvb{overflow-anchor:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div class="fx" id="vig"></div><div class="fx" id="flash"></div>
<div id="top"><div id="phase" class="t"></div><div class="stat" id="foe"></div></div>
<div id="tools"><button class="ghost" id="bWin" aria-label="How each side can win" title="How each side can win">&#9873;</button><button class="ghost" id="bMenu" aria-label="Menu">&#9776;</button>
  <div id="menu" hidden>
    <p class="mh">This game</p>
    <button class="ghost" id="bNote">✎ Add note</button>
    <button class="ghost" id="bSaveRep">Save replay</button>
    <button class="ghost" id="bLog">Battle log</button>
    <button class="ghost" id="bAAR">After-action review</button>
    <button class="ghost" id="bRec">Game record and notes</button>
    <p class="mh">Help</p>
    <button class="ghost" id="bWinM">⚑ How each side can win</button>
    <button class="ghost" id="bFM">Field Manual</button>
    <button class="ghost" id="bLib">Card library</button>
    <p class="mh">Table</p>
    <button class="ghost" id="bSpeed">Speed 1×</button>
    <button class="ghost" id="bSkip">Skip to my turn</button>
    <button class="ghost" id="bSettings">⚙ Settings</button>
    <button class="ghost" id="bQuit">Abandon game</button>
  </div></div>
<div id="feed"></div><div id="dragGhost"></div>
<div id="route"></div>
<div id="mtrack"></div>
<div id="banner" class="t"></div>
<div id="show"><img id="showImg" alt=""><div id="showLab" class="t"></div></div>
<div id="preview"></div>
<div id="bot"><div id="hand"></div><div id="prompt"></div><div id="me" class="me"><div class="stat" id="you"></div></div></div>
<div id="zoom" role="dialog" aria-modal="true" aria-labelledby="zName"><div id="zScrim" aria-hidden="true"></div><div id="zPanel"><div id="zHead"><div id="zGrab" aria-hidden="true"><i></i></div><h3 id="zName"></h3><button class="ghost" id="zClose">Close</button></div><div id="zWrap"><div id="zBody"><div class="zc"><img id="zImg" alt=""></div><div class="zt"><p id="zCap"></p><p id="zWhy"></p><div id="zRules"></div><div id="zGlos"></div><p class="zn"><button class="ghost lk" id="zNote">Add a note about this card</button></p></div></div><button type="button" id="zMore" tabindex="-1" aria-hidden="true">More ▼</button></div><div id="zFoot"><button class="big" id="zPick" style="display:none"></button><div id="zAct"></div></div></div></div></div>
<div id="debrief" role="dialog" aria-label="Debrief"></div>
<div id="log"></div>
<div id="piles" role="dialog" aria-label="Your cards"></div>
<div id="settings" role="dialog" aria-label="Settings"></div>
<div id="wint" role="dialog" aria-label="How each side can win"></div>
<div id="lib" role="dialog" aria-label="Card library"></div>
<div id="fm" role="dialog" aria-label="Field Manual"></div>
<div id="capt" aria-live="polite"></div>
<div id="cover"><div class="in"><h1 class="t">Shadows <span>&amp;</span> Steel</h1><p class="lead" id="lmsg">Loading the game engine. The first time takes the longest.</p><div class="bar" id="lbar"><i></i></div><pre id="lerr"></pre></div></div>
<script src="three.min.js"></script>
<script src="heights.js"></script>
<script src="terrain.js"></script>
<script src="art.js"></script>
<script src="brand.js"></script>
<script src="test/first-look-384b/cardface.js"></script>
<script src="sound.js"></script>
<script src="test/first-look-384b/input.js"></script>
<script src="test/first-look-384b/site.js"></script>
<script src="test/first-look-384b/battle.js"></script>
<script src="opening/opening.js"></script>
<script src="test/first-look-384b/test_recorder.js"></script>
<script type="module">
const msg = t => { const m = document.getElementById("lmsg"); if (m) m.textContent = t; };
try {
  const base = new URL("../../", location.href).href;
  const { loadPyodide } = await import(base + "pyodide/pyodide.mjs");
  const py = await loadPyodide({ indexURL: base + "pyodide/", stdLibURL: base + "pyodide/python_stdlib.wasm" });
  msg("Loading the cards and rules.");
  const man = await (await fetch(base + "gamefiles/manifest.json")).json();
  py.FS.mkdir("/game");
  for (const f of man.files) { const r = await fetch(base + "gamefiles/" + encodeURIComponent(f) + ".txt"); if (!r.ok) throw new Error("Could not load " + f); py.FS.writeFile("/game/" + f, new Uint8Array(await r.arrayBuffer())); }
  py.runPython("import sys; sys.dont_write_bytecode = True; sys.path.insert(0, '/game'); import browser_play");
  const handle = py.globals.get("browser_play").handle;
  window.SS.engine((p, b) => handle(p, b));
} catch (e) {
  msg("The game engine could not load in this browser."); document.getElementById("lbar").style.display = "none";
  document.getElementById("lerr").textContent = String(e && (e.stack || e.message) || e);
}
</script>
</body>
</html>
